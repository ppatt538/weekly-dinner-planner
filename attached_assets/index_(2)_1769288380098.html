<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Weekly Meal Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab {
            flex: 1;
            min-width: 120px;
            padding: 16px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            -webkit-tap-highlight-color: transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: white;
        }

        .tab-content {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            min-height: 44px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .filter-btn {
            padding: 12px 20px;
            min-height: 44px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .recipe-grid {
                grid-template-columns: 1fr;
            }
        }

        .recipe-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .recipe-card:active {
            transform: translateY(2px);
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .recipe-info {
            padding: 15px;
        }

        .recipe-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .recipe-cuisine {
            display: inline-block;
            padding: 6px 12px;
            background: #e9ecef;
            border-radius: 15px;
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .recipe-time {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .meal-plan {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .meal-plan {
                grid-template-columns: 1fr;
            }
        }

        .day-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }

        .day-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102,126,234,0.1);
        }

        .day-name {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .meal-slot {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meal-slot.empty {
            border: 2px dashed #dee2e6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-style: italic;
        }

        .meal-item {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .remove-btn {
            padding: 8px 12px;
            min-height: 44px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            align-self: flex-start;
            -webkit-tap-highlight-color: transparent;
        }

        .remove-btn:active {
            background: #c82333;
        }

        .calendar-btn {
            padding: 12px 16px;
            min-height: 44px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .calendar-btn:active {
            background: #218838;
        }

        .add-week-btn {
            padding: 16px 24px;
            min-height: 48px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .add-week-btn:active {
            background: #138496;
        }

        .shopping-list {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .shopping-category {
            margin-bottom: 25px;
        }

        .category-name {
            font-size: 20px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            min-height: 44px;
        }

        .shopping-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .shopping-item.checked {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                border-radius: 15px;
            }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f8f9fa;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .close-btn:active {
            background: #e9ecef;
        }

        .modal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .modal h2 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .modal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            padding: 8px 16px;
            background: #e9ecef;
            border-radius: 20px;
            font-size: 14px;
            color: #6c757d;
        }

        .ingredients-list, .instructions-list {
            margin-bottom: 25px;
        }

        .ingredients-list h3, .instructions-list h3 {
            font-size: 20px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .ingredients-list ul {
            list-style: none;
        }

        .ingredients-list li {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .instructions-list ol {
            padding-left: 20px;
        }

        .instructions-list li {
            padding: 10px 0;
            margin-bottom: 10px;
            line-height: 1.6;
            font-size: 16px;
        }

        .add-to-plan-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .add-to-plan-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .day-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            margin-bottom: 15px;
            background: white;
            cursor: pointer;
        }

        .add-plan-btn {
            width: 100%;
            padding: 16px;
            min-height: 48px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .add-plan-btn:active {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 18px;
            line-height: 1.6;
        }

        /* iOS-specific improvements */
        input, select, textarea, button {
            font-size: 16px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* Improve scrolling on iOS */
        .modal-content {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ Weekly Meal Planner</h1>
            <p>Plan your meals, create shopping lists, and add to calendar</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('recipes')">📖 Recipes</button>
            <button class="tab" onclick="switchTab('mealplan')">📅 Meal Plan</button>
            <button class="tab" onclick="switchTab('shopping')">🛒 Shopping List</button>
        </div>

        <div id="recipes" class="tab-content active">
            <div class="filter-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search recipes..." oninput="searchRecipes()">
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filterRecipes('All')">All Cuisines</button>
                <button class="filter-btn" onclick="filterRecipes('American')">American</button>
                <button class="filter-btn" onclick="filterRecipes('Italian')">Italian</button>
                <button class="filter-btn" onclick="filterRecipes('Asian')">Asian</button>
                <button class="filter-btn" onclick="filterRecipes('Mexican')">Mexican</button>
            </div>
            <div class="recipe-grid" id="recipeGrid"></div>
        </div>

        <div id="mealplan" class="tab-content">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">Weekly Meal Plan</h2>
            <div class="meal-plan" id="mealPlan"></div>
            <button class="add-week-btn" onclick="addEntireWeekToCalendar()">📅 Add Entire Week to Calendar</button>
        </div>

        <div id="shopping" class="tab-content">
            <h2 style="margin-bottom: 20px; color: #2c3e50;">Shopping List</h2>
            <div class="shopping-list" id="shoppingList">
                <div class="empty-state">
                    <div class="empty-state-icon">🛒</div>
                    <div class="empty-state-text">Add recipes to your meal plan to generate a shopping list</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

                name: "Beef Banh Mi Bowls",
                cuisine: "Asian",
                time: "45 min",

                ingredients: ["Ground beef 8-16 oz", "Jasmine rice", "Persian cucumber", "Carrot 3-6 oz", "Yellow onion", "Garlic 3-6 cloves", "Lime", "Ponzu sauce", "Sriracha", "Mayonnaise", "Sugar", "Butter", "Kosher salt", "Black pepper", "Cooking oil"],
                instructions: ["Cook jasmine rice according to package directions", "Trim and thinly slice cucumber on angle", "In bowl, toss cucumber with sugar and lime juice for quick pickle", "Peel carrot and cut into thin matchsticks", "Halve, peel, and thinly slice onion", "Mince garlic", "Heat oil in large pan over medium-high heat", "Add ground beef and cook until browned, 5-6 minutes", "Add onion and garlic and cook until softened, 3-4 minutes", "Stir in ponzu sauce", "Season with salt and pepper", "In small bowl, mix mayonnaise with sriracha for spicy mayo", "Divide rice between bowls", "Top with beef mixture", "Add pickled cucumber and fresh carrots", "Drizzle with sriracha mayo", "Garnish with lime wedges"],
                category: ["Protein", "Grains", "Produce"]
            },
        ];

        let mealPlan = {
            Sunday: null,
            Monday: null,
            Tuesday: null,
            Wednesday: null,
            Thursday: null,
            Friday: null,
            Saturday: null
        };

        let currentFilter = 'All';
        let searchTerm = '';

        function searchRecipes() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            renderRecipes();
        }

        function renderRecipes() {
            const grid = document.getElementById('recipeGrid');
            let filtered = currentFilter === 'All' 
                ? recipes 
                : recipes.filter(r => r.cuisine === currentFilter);
            
            if (searchTerm) {
                filtered = filtered.filter(r => 
                    r.name.toLowerCase().includes(searchTerm) ||
                    r.cuisine.toLowerCase().includes(searchTerm) ||
                    r.ingredients.some(ing => ing.toLowerCase().includes(searchTerm))
                );
            }
            
            grid.innerHTML = filtered.map(recipe => `
                <div class="recipe-card" onclick="openRecipe(${recipe.id})">
                    <img src="${recipe.image}" alt="${recipe.name}" class="recipe-image">
                    <div class="recipe-info">
                        <div class="recipe-name">${recipe.name}</div>
                        <span class="recipe-cuisine">${recipe.cuisine}</span>
                        <div class="recipe-time">⏱️ ${recipe.time}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterRecipes(cuisine) {
            currentFilter = cuisine;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderRecipes();
        }

        function openRecipe(id) {
            const recipe = recipes.find(r => r.id === id);
            const modal = document.getElementById('recipeModal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <img src="${recipe.image}" alt="${recipe.name}" class="modal-image">
                <h2>${recipe.name}</h2>
                <div class="modal-meta">
                    <span class="meta-item">${recipe.cuisine}</span>
                    <span class="meta-item">⏱️ ${recipe.time}</span>
                </div>
                
                <div class="ingredients-list">
                    <h3>Ingredients</h3>
                    <ul>
                        ${recipe.ingredients.map(ing => `<li>• ${ing}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="instructions-list">
                    <h3>Instructions</h3>
                    <ol>
                        ${recipe.instructions.map(inst => `<li>${inst}</li>`).join('')}
                    </ol>
                </div>
                
                <div class="add-to-plan-section">
                    <h3>Add to Meal Plan</h3>
                    <select class="day-select" id="daySelect">
                        <option value="">Select Day...</option>
                        <option value="Sunday">Sunday</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                        <option value="Saturday">Saturday</option>
                    </select>
                    <button class="add-plan-btn" onclick="addToMealPlan(${recipe.id})">Add to Plan</button>
                </div>
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.remove('active');
        }

        function addToMealPlan(recipeId) {
            const day = document.getElementById('daySelect').value;
            if (!day) {
                alert('Please select a day');
                return;
            }
            
            const recipe = recipes.find(r => r.id === recipeId);
            mealPlan[day] = recipe;
            renderMealPlan();
            updateShoppingList();
            closeModal();
        }

        function renderMealPlan() {
            const planDiv = document.getElementById('mealPlan');
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            
            planDiv.innerHTML = days.map(day => {
                const meal = mealPlan[day];
                return `
                    <div class="day-card">
                        <div class="day-name">${day}</div>
                        ${meal ? `
                            <div class="meal-slot">
                                <div class="meal-item">${meal.name}</div>
                                <div class="recipe-time">⏱️ ${meal.time}</div>
                                <button class="remove-btn" onclick="removeMeal('${day}')">Remove</button>
                            </div>
                            <button class="calendar-btn" onclick="addDayToCalendar('${day}')">📅 Add to Calendar</button>
                        ` : `
                            <div class="meal-slot empty">No meal planned</div>
                        `}
                    </div>
                `;
            }).join('');
        }

        function removeMeal(day) {
            mealPlan[day] = null;
            renderMealPlan();
            updateShoppingList();
        }

        function addDayToCalendar(day) {
            const meal = mealPlan[day];
            if (!meal) return;
            
            const nextSunday = getNextDate(day);
            const title = `Prepare: ${meal.name}`;
            const description = `Ingredients needed:\\n${meal.ingredients.join('\\n')}\\n\\nTime: ${meal.time}`;
            
            openCalendarEvent(title, description, nextSunday);
        }

        function addEntireWeekToCalendar() {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const mealsToAdd = days.filter(day => mealPlan[day]);
            
            if (mealsToAdd.length === 0) {
                alert('No meals planned yet!');
                return;
            }
            
            mealsToAdd.forEach((day, index) => {
                setTimeout(() => {
                    addDayToCalendar(day);
                }, index * 500);
            });
        }

        function openCalendarEvent(title, description, dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const startTime = '18:00:00';
            const endTime = '19:00:00';
            
            const startDate = `${year}${month}${day}T180000`;
            const endDate = `${year}${month}${day}T190000`;
            
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            
            if (isIOS) {
                const icsContent = generateICS(title, description, startDate, endDate);
                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `meal-${title.replace(/[^a-z0-9]/gi, '_')}.ics`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                setTimeout(() => {
                    alert('Calendar file downloaded! Open the file to add to your calendar.');
                }, 300);
            } else {
                const googleCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&details=${encodeURIComponent(description)}&dates=${startDate}Z/${endDate}Z`;
                window.open(googleCalUrl, '_blank');
            }
        }

        function generateICS(title, description, startDate, endDate) {
            return `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Meal Planner//EN
BEGIN:VEVENT
DTSTART:${startDate}
DTEND:${endDate}
SUMMARY:${title}
DESCRIPTION:${description.replace(/\n/g, '\\n')}
END:VEVENT
END:VCALENDAR`;
        }

        function getNextDate(dayName) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const today = new Date();
            const targetDay = days.indexOf(dayName);
            const currentDay = today.getDay();
            
            let daysUntilTarget = targetDay - currentDay;
            if (daysUntilTarget <= 0) {
                daysUntilTarget += 7;
            }
            
            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() + daysUntilTarget);
            return targetDate;
        }

        function updateShoppingList() {
            const listDiv = document.getElementById('shoppingList');
            const categories = {};
            
            Object.values(mealPlan).forEach(meal => {
                if (meal) {
                    meal.category.forEach(cat => {
                        if (!categories[cat]) categories[cat] = [];
                    });
                    meal.ingredients.forEach((ing, idx) => {
                        const cat = meal.category[idx % meal.category.length];
                        if (!categories[cat].includes(ing)) {
                            categories[cat].push(ing);
                        }
                    });
                }
            });
            
            if (Object.keys(categories).length === 0) {
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🛒</div>
                        <div class="empty-state-text">Add recipes to your meal plan to generate a shopping list</div>
                    </div>
                `;
                return;
            }
            
            listDiv.innerHTML = Object.keys(categories).map(cat => `
                <div class="shopping-category">
                    <div class="category-name">${cat}</div>
                    ${categories[cat].map(item => `
                        <div class="shopping-item">
                            <input type="checkbox" onchange="toggleItem(this)">
                            <span>${item}</span>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function toggleItem(checkbox) {
            checkbox.parentElement.classList.toggle('checked', checkbox.checked);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        renderRecipes();
        renderMealPlan();
    </script>
</body>
